backend:
  name: github
  repo: Sailendra-7/PF
  branch: main

# Uploaded images are committed here and served from /uploads/...
media_folder: website/public/uploads
public_folder: /uploads

site_url: /
display_url: /
locale: en

collections:
  - name: projects
    label: Projects
    label_singular: Project
    folder: website/content/projects
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    summary: "{{title}} ({{category}})"
    sortable_fields: [order, title, date]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD" }
      - { name: location, label: Location, widget: string, required: false }
      - name: category
        label: Category
        widget: select
        options: [Structural, Transportation, Materials, Geotech, Water, Survey, Other]
        default: Other
      - { name: summary, label: Short summary, widget: text, hint: "1-2 sentences shown on the project card and the map." }
      - { name: cover, label: Cover image, widget: image, required: false }
      - { name: gallery, label: Gallery images, widget: list, required: false, field: { name: image, label: Image, widget: image } }
      - { name: tools, label: Tools and methods, widget: list, required: false, hint: "e.g. AutoCAD, ETABS, Total Station" }
      - { name: highlights, label: Key findings, widget: list, required: false }
      - { name: featured, label: Featured project, widget: boolean, default: false }
      - { name: order, label: Order on the map, widget: number, value_type: int, min: 1, default: 10, hint: "1 = first island. Lower numbers come first." }
      - { name: body, label: Full write-up, widget: markdown, required: false }

  - name: settings
    label: Site content
    files:
      - name: profile
        label: Profile and contact
        file: website/content/profile.json
        format: json
        fields:
          - { name: name, label: Full name, widget: string }
          - { name: role, label: Role, widget: string }
          - { name: epithet, label: Poster nickname, widget: string }
          - { name: bounty, label: Bounty (shown on poster), widget: string }
          - { name: tagline, label: Headline, widget: string }
          - { name: semester, label: Semester, widget: string }
          - { name: college, label: College, widget: string }
          - { name: portrait, label: Wanted-poster photo, widget: image }
          - { name: aboutPhoto, label: About photo, widget: image }
          - { name: bio, label: About paragraphs, widget: list }
          - { name: dream, label: Dream (shown in the pirate profile), widget: string, required: false }
          - { name: devilFruit, label: Devil Fruit (a joke power name), widget: string, required: false }
          - { name: contactIntro, label: Contact intro text, widget: text }
          - { name: email, label: Email, widget: string }
          - { name: phone, label: Phone, widget: string }
          - { name: linkedin, label: LinkedIn URL, widget: string }
          - { name: formEndpoint, label: Form service URL (optional), widget: string, required: false, hint: "Formspree / Web3Forms URL. Leave empty to open the visitor's email app instead." }
      - name: skills
        label: Skills
        file: website/content/skills.json
        format: json
        fields:
          - name: groups
            label: Skill groups
            widget: list
            fields:
              - { name: crewRole, label: Crew role (e.g. Shipwright), widget: string }
              - { name: name, label: Group name, widget: string }
              - { name: items, label: Skills, widget: list }
