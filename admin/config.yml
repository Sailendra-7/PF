backend:
  name: github
  repo: Sailendra-7/PF
  branch: main

# Uploaded images are committed here and served from /uploads/...
media_folder: website/public/uploads
public_folder: /uploads

locale: en

collections:
  - name: projects
    label: Projects
    label_singular: Project
    folder: website/content/projects
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    summary: "{{title}} ({{category}})"
    sortable_fields: [order, title, date]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: category, label: Category, widget: select, options: [Structural, Transportation, Materials, Geotech, Water, Survey, Other], default: Other, hint: "Used for the filter buttons and the placeholder pattern when there is no photo." }
      - { name: summary, label: Short summary, widget: text, hint: "1-2 sentences shown on the project card." }
      - { name: cover, label: Cover image, widget: image, required: false, hint: "A site photo or drawing. If empty, a drawing-style pattern is shown." }
      - { name: location, label: Location, widget: string, required: false }
      - { name: date, label: Date, widget: datetime, time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD", required: false }
      - { name: tools, label: Tools and methods, widget: list, required: false, hint: "e.g. AutoCAD, ETABS, Total Station" }
      - { name: highlights, label: Key findings, widget: list, required: false }
      - { name: gallery, label: Gallery images, widget: list, required: false, field: { name: image, label: Image, widget: image } }
      - { name: featured, label: Featured project, widget: boolean, default: false, required: false }
      - { name: order, label: Order on the page, widget: number, value_type: int, min: 1, default: 10, hint: "1 = first. Lower numbers come first." }
      - { name: body, label: Full write-up, widget: markdown, required: false }

  - name: settings
    label: Site content
    files:
      - name: profile
        label: Profile and contact
        file: website/content/profile.json
        format: json
        fields:
          - { name: name, label: Full name, widget: string }
          - { name: role, label: Role, widget: string }
          - { name: tagline, label: Headline, widget: string, hint: "Short. The last word is highlighted." }
          - { name: intro, label: Intro under the headline, widget: text, hint: "About 20 words." }
          - { name: semester, label: Semester, widget: string }
          - { name: college, label: College, widget: string }
          - { name: portrait, label: Hero photo, widget: image }
          - { name: aboutPhoto, label: About photo, widget: image }
          - { name: bio, label: About paragraphs, widget: list }
          - { name: focus, label: Focus areas, widget: list }
          - { name: contactIntro, label: Contact intro text, widget: text }
          - { name: email, label: Email, widget: string }
          - { name: phone, label: Phone, widget: string }
          - { name: linkedin, label: LinkedIn URL, widget: string }
          - { name: formEndpoint, label: Form service URL (optional), widget: string, required: false, hint: "Formspree / Web3Forms URL. Leave empty to open the visitor's email app instead." }
      - name: skills
        label: Software and tools
        file: website/content/skills.json
        format: json
        fields:
          - name: groups
            label: Groups
            widget: list
            fields:
              - { name: name, label: Group name, widget: string }
              - { name: items, label: Tools, widget: list }
